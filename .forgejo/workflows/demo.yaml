name: example task
on: 
  push:         # Triggers the task every time you push code
    branches: [ main ]

jobs:
  my-task:
    runs-on: docker  # MUST match your runner's label
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        
      - name: hostname
        run: echo "$HOSTNAME"

      - name: CPU info
        run: lscpu

      - name: RAM info
        run: lshw -c memory

      - name: hard drive info
        run: df -h --total
