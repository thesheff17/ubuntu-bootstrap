---
- name: run updates, install basic packages, and install docker.
  hosts: allhosts
  become: true
  vars:
    arch_mapping:
      x86_64: amd64
      aarch64: arm64

  tasks:
    - name: run udpates
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600  # Only update cache if it hasn't been updated in the last hour

    - name: Create a new user if they do not exist
      ansible.builtin.user:
        name: ubuntu
        state: present
        shell: /bin/bash
        create_home: true

    - name: suppress ubuntu banner
      ansible.builtin.file:
        path: /home/ubuntu/.hushlogin
        state: touch
        owner: ubuntu
        group: ubuntu
        mode: '0644'
    
    - name: update apt cache and install prerequisite packages
      apt:
        name:
          - apt-utils
          - apt-transport-https
          - build-essential
          - ca-certificates
          - curl
          - git
          - gnupg
          - htop
          - lsb-release
          - python3-dev
          - python3-pip
          - vim
        state: present
        update_cache: true

    - name: create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: download docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: add docker DEB822 repository
      ansible.builtin.deb822_repository:
        name: docker
        state: present
        types: [deb]
        uris: "https://download.docker.com/linux/ubuntu"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc

    - name: install docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: comment out disable cri plugin
      replace:
        path: /etc/containerd/config.toml
        regexp: 'disabled_plugins = \[\"cri\"\]'
        replace: '# disabled_plugins = ["cri"]'

    - name: add ubuntu to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: enable and start docker service
      command: systemctl enable --now docker

    - name: enable and start containerd
      command: systemctl enable --now containerd

    - name: restart docker service
      ansible.builtin.service:
        name: containerd
        state: restarted
    
    - name: message
      ansible.builtin.debug:
      - name: message
        ansible.builtin.debug:
          msg: |
            you should reboot this device now.
            server: sudo reboot
            desktop: sudo systemctl reboot -i
