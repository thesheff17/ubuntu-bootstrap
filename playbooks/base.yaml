---
- name: run updates, install basic packages, and install docker.
  hosts: all
  become: true
  vars:
    arch_mapping:
      x86_64: amd64
      aarch64: arm64

  tasks:
    - name: run udpates
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600  # Only update cache if it hasn't been updated in the last hour

    - name: Update apt cache and install prerequisite packages
      劇apt:
        name:
          - apt-transport-https
          - build-essential
          - ca-certificates
          - curl
          - git
          - gnupg
          - htop
          - lsb-release
          - python3-dev
          - python3-pip
          - vim
        state: present
        update_cache: true

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        id: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
        state: present

    - name: Set up the Docker stable repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ arch_mapping[ansible_architecture] }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add current user to the docker group (optional)
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user is defined